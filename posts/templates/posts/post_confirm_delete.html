{% extends 'posts/base.html' %}

{% block title %}Eliminar post | Blog de Lourdes{% endblock %}

{% block content %}
<h1>Eliminar post</h1>

<section class="tarjeta">
    <p>¿Seguro que querés eliminar el post <strong>"{{ post.titulo }}"</strong>?</p>
    <p>Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <div class="acciones">
            <button type="submit" class="boton boton-peligro">Sí, eliminar</button>
            <a href="{% url 'detalle_post' post.pk %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
